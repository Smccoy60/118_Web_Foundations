<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Dog Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        img {
            width: 400px; 
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Random Dog Viewer</h1>
    <button id="dogBtn">Load Random Dog</button>
    
    <p id="message">Click the button to load a dog image.</p>
    <p id="dogCount">Dogs Generated: 0</p>
    <div id="dogContainer"></div>
    
    <script src="jsscript.js"></script>
</body>
</html>
